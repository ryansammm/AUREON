services:
  aureon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aureon
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - aureon-output:/aureon/output
      # Persist .env settings (Gemini/Groq keys) written via the web UI
      # across container restarts.
      - ./.env:/aureon/.env
    restart: unless-stopped

volumes:
  aureon-output:
