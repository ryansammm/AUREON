name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FluidSynth + GM SoundFont
        run: |
          sudo apt-get update
          sudo apt-get install -y fluidsynth fluid-soundfont-gm

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q --tb=long > pytest-out.txt 2>&1 || {
            rc=$?
            echo "pytest exited with $rc"
            exit $rc
          }

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-out
          path: pytest-out.txt
          if-no-files-found: ignore

  frontend:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
